<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#1b2230"/>
      <stop offset="0.6" stop-color="#0d1118"/>
      <stop offset="1" stop-color="#05070b"/>
    </radialGradient>
    <linearGradient id="vgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff35a"/>
      <stop offset="0.55" stop-color="#f7d21e"/>
      <stop offset="1" stop-color="#e09a0c"/>
    </linearGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2a2a" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#ff3b30"/>
      <stop offset="0.5" stop-color="#ffd0c8"/>
      <stop offset="0.75" stop-color="#ff3b30"/>
      <stop offset="1" stop-color="#ff2a2a" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="3" fill="#ffffff" fill-opacity="0.035"/>
    </pattern>
    <clipPath id="vclip">
      <path d="M262 250 L392 250 L512 560 L632 250 L762 250 L566 720 L458 720 Z"/>
    </clipPath>
  </defs>

  <!-- fond -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#scan)"/>

  <!-- coins du HUD -->
  <g stroke="#52fff0" stroke-width="6" fill="none" stroke-linecap="square" opacity="0.85">
    <path d="M60 140 V60 H140"/><path d="M884 60 H964 V140"/>
    <path d="M60 884 V964 H140"/><path d="M964 884 V964 H884"/>
  </g>
  <text x="74" y="104" font-family="Consolas, monospace" font-size="20" fill="#52fff0" opacity="0.7" letter-spacing="3">SYS.ONLINE</text>
  <text x="950" y="104" font-family="Consolas, monospace" font-size="20" fill="#ff3b30" opacity="0.8" text-anchor="end" letter-spacing="3">REC ●</text>

  <!-- anneau radar -->
  <g transform="translate(512 470)">
    <circle r="330" fill="none" stroke="#52fff0" stroke-opacity="0.25" stroke-width="2"/>
    <circle r="300" fill="none" stroke="#52fff0" stroke-opacity="0.55" stroke-width="5" stroke-dasharray="120 18 40 18" filter="url(#softglow)"/>
    <circle r="268" fill="none" stroke="#52fff0" stroke-opacity="0.15" stroke-width="2"/>
    <g stroke="#52fff0" stroke-opacity="0.6" stroke-width="4">
      <line y1="-345" y2="-315"/><line y1="345" y2="315"/>
      <line x1="-345" x2="-315"/><line x1="345" x2="315"/>
    </g>
    <!-- balayage -->
    <path d="M0 0 L0 -300 A300 300 0 0 1 212 -212 Z" fill="#52fff0" fill-opacity="0.07"/>
    <!-- echos du radar : le chat -->
    <circle cx="262" cy="-40" r="10" fill="#52ff8c" filter="url(#softglow)"/>
    <circle cx="-220" cy="90" r="7" fill="#c785ff" filter="url(#softglow)"/>
    <circle cx="150" cy="190" r="7" fill="#ffd447" filter="url(#softglow)"/>
  </g>

  <!-- V : aberration chromatique -->
  <path d="M262 250 L392 250 L512 560 L632 250 L762 250 L566 720 L458 720 Z" fill="#00f0ff" opacity="0.55" transform="translate(-12 4)"/>
  <path d="M262 250 L392 250 L512 560 L632 250 L762 250 L566 720 L458 720 Z" fill="#ff1e3c" opacity="0.6" transform="translate(12 -4)"/>
  <!-- V principal -->
  <path d="M262 250 L392 250 L512 560 L632 250 L762 250 L566 720 L458 720 Z" fill="url(#vgrad)" filter="url(#glow)"/>
  <!-- tranches glitch dans le V -->
  <g clip-path="url(#vclip)">
    <rect x="200" y="356" width="640" height="10" fill="#0d1118"/>
    <rect x="200" y="452" width="640" height="5" fill="#0d1118"/>
    <rect x="180" y="604" width="640" height="14" fill="#0d1118"/>
    <rect x="200" y="250" width="640" height="470" fill="url(#scan)"/>
  </g>
  <rect x="236" y="604" width="90" height="14" fill="#f7d21e" opacity="0.9"/>
  <rect x="700" y="356" width="70" height="10" fill="#f7d21e" opacity="0.9"/>

  <!-- oeil V-800 -->
  <rect x="300" y="300" width="424" height="22" fill="url(#eye)" filter="url(#glow)"/>
  <rect x="490" y="296" width="44" height="30" fill="#fff" filter="url(#glow)"/>

  <!-- titre -->
  <g font-family="Bahnschrift, 'Arial Narrow', Arial, sans-serif" font-weight="700" text-anchor="middle">
    <text x="518" y="852" font-size="118" fill="#00f0ff" opacity="0.5" letter-spacing="10">AGENT V-800</text>
    <text x="506" y="848" font-size="118" fill="#ff1e3c" opacity="0.55" letter-spacing="10">AGENT V-800</text>
    <text x="512" y="850" font-size="118" fill="#f4f1e8" letter-spacing="10" filter="url(#softglow)">AGENT V-800</text>
  </g>

  <!-- bandeau : le chat controle le monde -->
  <g transform="translate(512 912)">
    <path d="M-330 -30 H318 L340 -8 V30 H-318 L-340 8 V-8 Z" fill="#0a1a10" stroke="#52ff8c" stroke-width="3"/>
    <text y="12" font-family="Consolas, monospace" font-weight="700" font-size="32" fill="#52ff8c" text-anchor="middle" letter-spacing="4" filter="url(#softglow)">&gt; LE CHAT CONTRÔLE LE MONDE_</text>
  </g>
</svg>
